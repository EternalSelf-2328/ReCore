[package]
name = "recore-css"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"
description = "Reads Discord CSS themes (Vencord, Vesktop and compatible) into ReCore's colours and look; see docs/themes.md"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
# The CSS engine: parsing, selectors, cascade, inheritance, custom
# properties and taffy layout for a theme's synthetic regions. The semantic
# layer reads the computed values and the chosen theme's page DisplayList;
# iced paints it. See docs/themes.md.
style-engine = { version = "1.0.0", default-features = false, features = ["layout"] }
