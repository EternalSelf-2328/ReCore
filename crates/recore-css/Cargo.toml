[package]
name = "recore-css"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"
description = "Reads Discord CSS themes (Vencord, Vesktop and compatible) into ReCore's colours and look; see docs/themes.md"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
# The CSS engine: parsing, selectors, cascade, inheritance and custom
# properties for a theme's synthetic regions. Its optional taffy/parley
# features can be enabled when the window paints a CSS layout; the semantic
# layer reads the L1 style algebra and leaves painting to iced. See
# docs/themes.md.
style-engine = { version = "1.0.0", default-features = false }
