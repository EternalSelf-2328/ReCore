name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: CSS interpreter lints
        run: cargo clippy -p recore-css --all-targets --locked -- -D warnings
      - name: CSS interpreter tests
        run: cargo test -p recore-css --locked
